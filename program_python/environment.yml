name: demchange
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.20
  - gdal>=3.5
  - rasterio>=1.3

# Usage:
# Create environment: conda env create -f environment.yml
# Activate environment: conda activate demchange
# Deactivate environment: conda deactivate
#
# To update environment: conda env update -f environment.yml --prune
# To remove environment: conda env remove -n demchange
#
# After activation, run the DEM change detection with:
#   python python/dem_change.py [params.ini]
